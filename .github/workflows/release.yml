name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update, for example v1.5.0"
        required: false
        type: string
      draft:
        description: "Create the GitHub release as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            zhttpd: "0"
            variant: ftp
          - platform: macos
            os: macos-latest
            zhttpd: "0"
            variant: ftp
          - platform: macos
            os: macos-latest
            zhttpd: "1"
            variant: zhttp
          - platform: ps4
            os: ubuntu-latest
            zhttpd: "0"
            variant: ftp
          - platform: ps4
            os: ubuntu-latest
            zhttpd: "1"
            variant: zhttp
          - platform: ps5
            os: ubuntu-latest
            zhttpd: "0"
            variant: ftp
          - platform: ps5
            os: ubuntu-latest
            zhttpd: "1"
            variant: zhttp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            clang \
            cmake \
            curl \
            gcc \
            libarchive-dev \
            libcurl4-openssl-dev \
            lld \
            llvm \
            make \
            pkg-config \
            python3 \
            xxd

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libarchive llvm || true
          if [ -d /opt/homebrew/opt/llvm/bin ]; then
            echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          fi
          if [ -d /usr/local/opt/llvm/bin ]; then
            echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"
          fi

      - name: Clone and build PS4 Payload SDK
        if: matrix.platform == 'ps4'
        run: |
          set -euo pipefail
          sdk_src="$RUNNER_TEMP/ps4-payload-sdk"
          sdk_dst="$GITHUB_WORKSPACE/ps4-payload-sdk-install"
          git clone --recursive https://github.com/ps4-payload-dev/sdk.git "$sdk_src"
          make -C "$sdk_src" -j"$(nproc)"
          make -C "$sdk_src" DESTDIR="$sdk_dst" install
          test -f "$sdk_dst/toolchain/orbis.mk"
          test -x "$sdk_dst/bin/orbis-clang"
          echo "PS4_PAYLOAD_SDK=$sdk_dst" >> "$GITHUB_ENV"

      - name: Clone and build PS5 Payload SDK
        if: matrix.platform == 'ps5'
        run: |
          set -euo pipefail
          sdk_src="$RUNNER_TEMP/ps5-payload-sdk"
          sdk_dst="$GITHUB_WORKSPACE/ps5-payload-sdk-install"
          git clone --recursive https://github.com/ps5-payload-dev/sdk.git "$sdk_src"
          make -C "$sdk_src" -j"$(nproc)"
          make -C "$sdk_src" DESTDIR="$sdk_dst" install
          test -f "$sdk_dst/toolchain/prospero.mk"
          test -x "$sdk_dst/bin/prospero-clang"
          echo "PS5_PAYLOAD_SDK=$sdk_dst" >> "$GITHUB_ENV"

      - name: Build release variant
        run: |
          set -euo pipefail
          make resources

          if [ "${{ matrix.platform }}" = "ps4" ]; then
            make \
              PS4_PAYLOAD_SDK="${PS4_PAYLOAD_SDK}" \
              TARGET="${{ matrix.platform }}" \
              BUILD_TYPE=release \
              ENABLE_ZHTTPD="${{ matrix.zhttpd }}" \
              ENABLE_MCP=0 \
              ENABLE_PKG_INSTALL=0 \
              clean all
          elif [ "${{ matrix.platform }}" = "ps5" ]; then
            make \
              PS5_PAYLOAD_SDK="${PS5_PAYLOAD_SDK}" \
              TARGET="${{ matrix.platform }}" \
              BUILD_TYPE=release \
              ENABLE_ZHTTPD="${{ matrix.zhttpd }}" \
              ENABLE_MCP=0 \
              ENABLE_PKG_INSTALL=0 \
              clean all
          else
            make \
              TARGET="${{ matrix.platform }}" \
              BUILD_TYPE=release \
              ENABLE_ZHTTPD="${{ matrix.zhttpd }}" \
              ENABLE_MCP=0 \
              ENABLE_PKG_INSTALL=0 \
              clean all
          fi

      - name: Package artifact
        run: |
          set -euo pipefail
          variant_dir="build/${{ matrix.platform }}/release"
          if [ "${{ matrix.zhttpd }}" = "1" ]; then
            variant_dir="${variant_dir}-zhttp"
          fi

          mkdir -p dist

          if [ "${{ matrix.platform }}" = "ps4" ] || [ "${{ matrix.platform }}" = "ps5" ]; then
            # PS4/PS5: upload .elf and .bin directly (ready for payload injection)
            find "$variant_dir" -maxdepth 1 \( -name '*.elf' -o -name '*.bin' \) -print -exec cp {} dist/ \;
            ls -la dist/

          elif [ "${{ matrix.platform }}" = "macos" ]; then
            # macOS: bundle into .app
            elf=$(find "$variant_dir" -maxdepth 1 -name 'zftpd-*' ! -name '*.bin' ! -name '*.tar.gz' -type f | head -1)
            if [ -z "$elf" ]; then
              echo "ERROR: no ELF binary found in $variant_dir"
              ls -la "$variant_dir"
              exit 1
            fi
            # Extract version from ftp_config.h (same method as Makefile)
            VERSION=$(grep -E 'define[[:space:]]+RELEASE_VERSION' include/ftp_config.h | head -1 | cut -d'"' -f2)
            app_dir="dist/${elf##*/}.app"
            mkdir -p "${app_dir}/Contents/MacOS"
            cp "$elf" "${app_dir}/Contents/MacOS/zftpd"
            chmod +x "${app_dir}/Contents/MacOS/zftpd"
            cat > "${app_dir}/Contents/Info.plist" << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>zftpd</string>
              <key>CFBundleIdentifier</key>
              <string>com.zftpd.server</string>
              <key>CFBundleName</key>
              <string>zftpd</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION:-0.0.0}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION:-0.0.0}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLISTEOF
            tar -C dist -czf "dist/${elf##*/}.app.tar.gz" "${elf##*/}.app"
            rm -rf "${app_dir}"
            ls -la dist/

          else
            # Linux: standard tar.gz with BUILD_INFO
            pkg_dir="dist/${{ matrix.platform }}-${{ matrix.variant }}"
            mkdir -p "$pkg_dir"
            find "$variant_dir" -maxdepth 1 -type f -print -exec cp {} "$pkg_dir/" \;
            cat > "$pkg_dir/BUILD_INFO.txt" <<EOF
          project=zftpd
          platform=${{ matrix.platform }}
          zhttpd=${{ matrix.zhttpd }}
          mcp=0
          pkg_install=0
          build_type=release
          ref=${{ github.ref_name }}
          sha=${{ github.sha }}
          EOF
            tar -C dist -czf "dist/zftpd-${{ matrix.platform }}-${{ matrix.variant }}.tar.gz" "${{ matrix.platform }}-${{ matrix.variant }}"
            rm -rf "$pkg_dir"
            ls -la dist/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zftpd-${{ matrix.platform }}-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.elf' -o -name '*.bin' \) -exec cp {} release-assets/ \;
          cd release-assets
          if ls *.tar.gz *.elf *.bin >/dev/null 2>&1; then
            sha256sum *.tar.gz *.elf *.bin > SHA256SUMS.txt 2>/dev/null
          fi
          ls -lh

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              git tag "${tag}" "${GITHUB_SHA}"
              git push origin "refs/tags/${tag}"
            fi
          fi

          flags=(--title "zftpd ${tag}" --generate-notes)
          if [ "${INPUT_DRAFT}" = "true" ]; then
            flags+=(--draft)
          fi
          if [ "${INPUT_PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* "${flags[@]}"
          fi
